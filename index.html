<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>Budget</title>
<style>
:root{--accent:#0b5cad;--line:#d6d6d6;--muted:#555}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#fff}
body{margin:0;background:#fff;color:#000;font:18px/1.45 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + env(safe-area-inset-top)) 16px 6px}
header h1{font-size:22px;margin:0;font-weight:700}
main{padding:12px 16px 24px;max-width:640px;margin:0 auto}
#banner{max-width:640px;margin:0 auto;padding:0 16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:60px;border:0;border-radius:0;border-top:3px solid transparent;background:#fff;color:#000;font-size:14px;padding:4px 2px}
nav button.on{color:var(--accent);border-top-color:var(--accent);font-weight:700}
h2{font-size:20px;margin:0 0 8px}
.card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
.label{font-size:15px;color:var(--muted);margin:0 0 2px}
.big{font-size:34px;font-weight:700;line-height:1.15}
.next{font-size:21px;font-weight:700}
.small{font-size:15px;color:var(--muted)}
.status{font-size:20px;font-weight:700;margin-top:4px}
.good{color:var(--accent)}
.bad{color:#000;text-decoration:underline}
button{min-height:48px;font-size:17px;font-family:inherit;border-radius:8px;padding:10px 16px;border:1px solid #000;background:#fff;color:#000;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.link{border:0;padding:10px 0;color:var(--accent);background:none;font-weight:600}
button.sm{min-height:44px;padding:6px 12px;font-size:15px}
button:disabled{opacity:.35}
.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns button{flex:1 1 auto}
label{display:block;font-size:15px;margin:12px 0 4px}
input,select,textarea{width:100%;min-height:48px;font-size:17px;font-family:inherit;padding:10px 12px;border:1px solid #888;border-radius:8px;background:#fff;color:#000}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:26px;height:26px;min-height:0;vertical-align:middle;margin:0 8px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .r{text-align:right;white-space:nowrap}
.warn{border:2px solid #000;border-radius:10px;padding:10px 14px;font-weight:700;margin:0 0 12px}
.banner{border:2px solid var(--accent);border-radius:10px;padding:12px 14px;margin:12px 0 0}
.banner b{display:block;font-size:18px}
.tag{display:inline-block;font-size:13px;font-weight:700;border:1px solid #000;border-radius:4px;padding:0 6px;margin-left:6px;vertical-align:middle}
.tag.next{border-color:var(--accent);color:var(--accent)}
.over{font-weight:700;border:2px solid #000;border-radius:4px;padding:0 6px}
.bar{height:14px;border:1px solid #000;border-radius:7px;overflow:hidden;margin:10px 0 4px}
.bar>div{height:100%;background:var(--accent)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:700}
td.note{white-space:normal;text-align:left;padding-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .acts{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
.editrow{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.editrow .full-row{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details summary{min-height:44px;padding:10px 0;color:var(--accent);font-weight:600;cursor:pointer}
ol.rules{padding-left:24px;margin:0}
ol.rules li{margin:0 0 14px;font-size:19px}
.hidden{display:none}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:10;background:#000;color:#fff;padding:12px 16px;border-radius:8px;font-size:16px;display:none;max-width:608px;margin:0 auto}
</style>
</head>
<body>
<header>
  <h1 id="title">Home</h1>
  <button class="link" data-act="go" data-v="rules">Rules</button>
</header>
<div id="banner"></div>
<main id="view"></main>
<nav id="nav"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" class="hidden">

<script>
'use strict';
var KEY = 'budgetTracker.v1';
var ACCENT = '#0b5cad';

/* ---------- helpers ---------- */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function pad(n){ return String(n).padStart(2, '0'); }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYMD(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function today(){ return ymd(new Date()); }
function monthOf(s){ return s.slice(0, 7); }
function curMonth(){ return monthOf(today()); }
function addMonths(m, n){ var p = m.split('-').map(Number); var d = new Date(p[0], p[1] - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
function monthEnd(m){ var p = m.split('-').map(Number); return ymd(new Date(p[0], p[1], 0)); }
function monthName(m, short){ var p = m.split('-').map(Number); return new Date(p[0], p[1] - 1, 1).toLocaleDateString('en-US', { month: short ? 'short' : 'long', year: 'numeric' }); }
function fmtDate(s){ if (!s) return '—'; var d = parseYMD(s); return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear(); }
function dayName(s){ return parseYMD(s).toLocaleDateString('en-US', { weekday: 'short' }); }
function daysBetween(a, b){ return Math.round((parseYMD(b) - parseYMD(a)) / 86400000); }
function monthsRange(a, b){ var out = [], m = a, guard = 0; while (m <= b && guard++ < 600){ out.push(m); m = addMonths(m, 1); } return out; }
function r2(n){ return Math.round((+n || 0) * 100) / 100; }
function num(v){ var x = parseFloat(String(v == null ? '' : v).replace(/[$,\s]/g, '')); return isFinite(x) ? r2(x) : NaN; }
function money(n){ n = r2(n); var neg = n < 0; var s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 }); return (neg ? '-' : '') + '$' + s; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function sortT(list){ return list.slice().filter(function(x){ return x && x.date; }).sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }); }
function sum(arr, f){ return r2(arr.reduce(function(t, x){ return t + (f ? f(x) : x); }, 0)); }
function byDateDesc(a, b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }

/* ---------- data ---------- */
function defaultState(){
  function cat(id, name, budget, rollover){ return { id: id, name: name, budget: budget, rollover: !!rollover }; }
  return {
    version: 1,
    settings: {
      takeHomeMonthly: 3800,
      payAnchor: '2026-10-09',
      payEveryDays: 14,
      childSupportMonthly: 2500,
      supportStartMonth: '2026-10',
      budgetStartMonth: '2026-10',
      planToDebtSavings: 2000,
      targetToDebtSavings: 2060,
      categories: [
        cat('rent', 'Rent', 1625), cat('utilities', 'Utilities', 215), cat('carpay', 'Car payment', 612),
        cat('carins', 'Car insurance', 155), cat('gas', 'Gas', 500), cat('groceries', 'Groceries', 500),
        cat('phone', 'Cell phone', 70), cat('student', 'Student loan', 102), cat('hair', 'Hair fund', 145, true),
        cat('spotify', 'Spotify', 13), cat('amazon', 'Amazon household/kids', 150), cat('fun', 'Going out / coffee / fun', 150),
        cat('misc', 'Medical / pet / clothing / misc', 63)
      ],
      debtTargets: [
        { date: '2026-10-31', amount: 6173 }, { date: '2026-11-30', amount: 4113 },
        { date: '2026-12-31', amount: 2053 }, { date: '2027-01-31', amount: 0 }
      ],
      savingsTargets: [
        { date: '2027-02-28', amount: 2000 }, { date: '2027-03-31', amount: 4000 }, { date: '2027-04-30', amount: 6000 },
        { date: '2027-05-31', amount: 8000 }, { date: '2027-06-30', amount: 10000 }
      ],
      savingsGoal: 10000,
      taxRefundExpected: 8000,
      arrearsOwed: 15000,
      houseGoal: 23000,
      tripGoal: 2500,
      lastSpendAcct: 'chime',
      payAcct: 'chime',
      supportAcct: 'reliacard'
    },
    accounts: [
      { id: 'chime', name: 'Chime', start: 0, startDate: '', startTs: 0, setup: false, reconciled: null },
      { id: 'reliacard', name: 'ReliaCard', start: 0, startDate: '', startTs: 0, setup: false, reconciled: null },
      { id: 'venmo', name: 'Venmo', start: 0, startDate: '', startTs: 0, setup: false, reconciled: null }
    ],
    transfers: [],     // {id, date, ts, from, to, amount, note, status}
    acctAdj: [],       // {id, acct, date, ts, amount (+/-), note, status}
    reconHistory: [],  // {id, date, type:'account'|'debt', ref, name, expected, actual, diff, note}
    debts: [
      { id: 'apple', name: 'Apple Card', start: 500 },
      { id: 'nordstrom', name: 'Nordstrom', start: 451 },
      { id: 'affirm', name: 'Affirm', start: 916 },
      { id: 'citi', name: 'Citi', start: 3540 },
      { id: 'chase', name: 'Chase', start: 2826 }
    ],
    debtEntries: [],   // {id, debtId, date, kind:'payment'|'adjust', amount, note}
    transactions: [],  // {id, date, amount, catId, note}
    income: [],        // {id, date, type:'pay'|'support', amount, month, note}
    funds: [],         // {id, fund:'savings'|'house'|'trip', kind:'deposit'|'withdrawal', amount, date, source, note}
    checkins: [],      // {date, checking, venmo, debts:{id:balance}, totalDebt}
    scoreNotes: {},
    monthBudgets: {},
    lastBackup: null
  };
}

function normalize(obj){
  var d = defaultState();
  var out = Object.assign({}, d, obj || {});
  out.settings = Object.assign({}, d.settings, (obj && obj.settings) || {});
  ['debts', 'debtEntries', 'transactions', 'income', 'funds', 'checkins', 'accounts', 'transfers', 'acctAdj', 'reconHistory'].forEach(function(k){ if (!Array.isArray(out[k])) out[k] = []; });
  // Older backups: give every entry an account and a cleared/pending status.
  var first = out.accounts[0] ? out.accounts[0].id : '';
  function st(x){ if (x.status !== 'pending') x.status = 'cleared'; }
  out.transactions.forEach(function(t){ if (t.acct == null) t.acct = first; st(t); });
  out.income.forEach(function(i){ if (i.acct == null) i.acct = i.type === 'support' && out.accounts.some(function(a){ return a.id === 'reliacard'; }) ? 'reliacard' : first; st(i); });
  out.debtEntries.forEach(function(e){ if (e.kind === 'payment' && e.fromAcct == null) e.fromAcct = ''; st(e); });
  out.funds.forEach(function(f){ if (f.acct == null) f.acct = ''; st(f); });
  out.transfers.forEach(st); out.acctAdj.forEach(st);
  ['categories', 'debtTargets', 'savingsTargets'].forEach(function(k){ if (!Array.isArray(out.settings[k])) out.settings[k] = d.settings[k]; });
  if (!out.scoreNotes || typeof out.scoreNotes !== 'object') out.scoreNotes = {};
  if (!out.monthBudgets || typeof out.monthBudgets !== 'object') out.monthBudgets = {};
  return out;
}

function load(){
  try { var raw = localStorage.getItem(KEY); if (raw) return normalize(JSON.parse(raw)); } catch (e) {}
  return defaultState();
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Could not save on this device. Export a backup now.'); }
}

var S = load();

/* ---------- calculations ---------- */
function snapshotCurrent(){
  S.monthBudgets[curMonth()] = S.settings.categories.map(function(c){ return { id: c.id, name: c.name, budget: c.budget, rollover: !!c.rollover }; });
}
function budgetsFor(m){ return S.monthBudgets[m] || S.settings.categories; }
function txIn(m){ return S.transactions.filter(function(t){ return monthOf(t.date) === m; }); }
function spentIn(m, catId){ return sum(S.transactions.filter(function(t){ return t.catId === catId && monthOf(t.date) === m; }), function(t){ return t.amount; }); }
function catStatus(m, c){
  var spent = spentIn(m, c.id);
  var start = S.settings.budgetStartMonth;
  if (c.rollover && start && m >= start){
    var acc = 0, spentAll = 0;
    monthsRange(start, m).forEach(function(k){
      var b = budgetsFor(k).filter(function(x){ return x.id === c.id; })[0];
      acc += b ? (+b.budget || 0) : 0;
      spentAll += spentIn(k, c.id);
    });
    return { name: c.name, id: c.id, budget: c.budget, spent: spent, left: r2(acc - spentAll), rollover: true };
  }
  return { name: c.name, id: c.id, budget: c.budget, spent: spent, left: r2((+c.budget || 0) - spent), rollover: false };
}
function monthSpending(m){
  var cats = budgetsFor(m).map(function(c){ return catStatus(m, c); });
  var known = {}; cats.forEach(function(c){ known[c.id] = 1; });
  var orphan = sum(txIn(m).filter(function(t){ return !known[t.catId]; }), function(t){ return t.amount; });
  if (orphan) cats.push({ name: 'Deleted category', id: '_deleted', budget: 0, spent: orphan, left: -orphan, rollover: false });
  var budget = sum(budgetsFor(m), function(c){ return +c.budget || 0; });
  var spent = sum(txIn(m), function(t){ return t.amount; });
  return { cats: cats, budget: budget, spent: spent, left: r2(budget - spent) };
}
function catName(id){
  var c = S.settings.categories.filter(function(x){ return x.id === id; })[0];
  if (c) return c.name;
  for (var m in S.monthBudgets){ var o = S.monthBudgets[m].filter(function(x){ return x.id === id; })[0]; if (o) return o.name; }
  return 'Deleted category';
}

// Everything that changes a debt's balance: payments, adjustments, and spending charged to that card.
function debtEvents(debt){
  var ev = [];
  S.debtEntries.forEach(function(e){ if (e.debtId === debt.id) ev.push({ date: e.date, delta: e.kind === 'payment' ? -e.amount : e.amount }); });
  S.transactions.forEach(function(t){ if (t.acct === 'debt:' + debt.id) ev.push({ date: t.date, delta: t.amount }); });
  return ev.sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
}
function debtBalance(debt, asOf){
  var b = +debt.start || 0;
  debtEvents(debt).forEach(function(e){ if (!asOf || e.date <= asOf) b += e.delta; });
  return r2(b);
}
function totalDebt(asOf){ return sum(S.debts, function(d){ return Math.max(0, debtBalance(d, asOf)); }); }
function startingDebt(){ return sum(S.debts, function(d){ return +d.start || 0; }); }
function debtPaidOffDate(debt){
  var b = +debt.start || 0, paid = null;
  debtEvents(debt).forEach(function(e){
    b += e.delta;
    if (r2(b) <= 0 && !paid) paid = e.date;
    if (r2(b) > 0) paid = null;
  });
  return r2(b) <= 0 ? (paid || 'yes') : null;
}
function nextDebt(){ return S.debts.filter(function(d){ return debtBalance(d) > 0; })[0] || null; }
function debtName(id){ var d = S.debts.filter(function(x){ return x.id === id; })[0]; return d ? d.name : 'Removed debt'; }
// New charges this month: spending put on a card, or a reconciliation posted as "New charge".
function newCharges(m){
  var out = [];
  S.transactions.forEach(function(t){ if (t.acct && t.acct.indexOf('debt:') === 0 && monthOf(t.date) === m) out.push({ name: debtName(t.acct.slice(5)), amount: t.amount, date: t.date }); });
  S.debtEntries.forEach(function(e){ if (e.kind === 'adjust' && e.reason === 'charge' && monthOf(e.date) === m) out.push({ name: debtName(e.debtId), amount: e.amount, date: e.date }); });
  return out;
}
function chargeWarning(m){
  var ch = newCharges(m); if (!ch.length) return '';
  var byCard = {}; ch.forEach(function(c){ byCard[c.name] = r2((byCard[c.name] || 0) + c.amount); });
  return '<div class="warn">New card charges in ' + monthName(m) + ': ' + Object.keys(byCard).map(function(k){ return esc(k) + ' ' + money(byCard[k]); }).join(', ') +
    '. This breaks rule 1 (no new carried balances). Pay it off now.</div>';
}

/* ---------- cash accounts ---------- */
function acctById(id){ return S.accounts.filter(function(a){ return a.id === id; })[0] || null; }
function acctName(key){
  if (!key) return 'Not from these accounts';
  if (key.indexOf('debt:') === 0) return debtName(key.slice(5)) + ' (card)';
  var a = acctById(key); return a ? a.name : 'Removed account';
}
function inWindow(a, e){
  if (!a.setup || !a.startDate) return false;
  if (e.date > a.startDate) return true;
  if (e.date < a.startDate) return false;
  return (e.ts || 0) > (a.startTs || 0);
}
// Every logged item that moves money in or out of a cash account, since its start.
function acctItems(a){
  var items = [];
  function add(src, e, amt, label){ if (inWindow(a, e)) items.push({ src: src, id: e.id, date: e.date, amount: r2(amt), label: label, status: e.status || 'cleared', note: e.note || '' }); }
  S.income.forEach(function(i){ if (i.acct === a.id) add('income', i, i.amount, i.type === 'pay' ? 'Paycheck' : i.type === 'support' ? 'Child support' : 'Money in'); });
  S.transactions.forEach(function(t){ if (t.acct === a.id) add('transactions', t, -t.amount, catName(t.catId)); });
  S.debtEntries.forEach(function(e){ if (e.kind === 'payment' && e.fromAcct === a.id) add('debtEntries', e, -e.amount, 'Payment to ' + debtName(e.debtId)); });
  var fnames = { savings: 'Savings', house: 'House fund', trip: 'Trip fund' };
  S.funds.forEach(function(f){ if (f.acct === a.id) add('funds', f, f.kind === 'withdrawal' ? f.amount : -f.amount, (f.kind === 'withdrawal' ? 'From ' : 'To ') + fnames[f.fund]); });
  S.transfers.forEach(function(x){
    if (x.from === a.id) add('transfers', x, -x.amount, 'Transfer to ' + acctName(x.to));
    if (x.to === a.id) add('transfers', x, x.amount, 'Transfer from ' + acctName(x.from));
  });
  S.acctAdj.forEach(function(j){ if (j.acct === a.id) add('acctAdj', j, j.amount, 'Adjustment'); });
  return items.sort(byDateDesc);
}
function acctCalc(a){
  var items = acctItems(a);
  var expected = r2((+a.start || 0) + sum(items, function(i){ return i.amount; }));
  var pending = sum(items.filter(function(i){ return i.status === 'pending'; }), function(i){ return i.amount; });
  return { items: items, expected: expected, pending: pending, cleared: r2(expected - pending) };
}
function acctOptions(sel, withCards, withNone){
  var h = S.accounts.map(function(a){ return opt(a.id, a.name, a.id === sel); }).join('');
  if (withCards) h += S.debts.map(function(d){ return opt('debt:' + d.id, 'Card: ' + d.name, 'debt:' + d.id === sel); }).join('');
  if (withNone) h += opt('', 'Not from these accounts', sel === '');
  return h;
}
function defAcct(pref){ return acctById(pref) ? pref : (S.accounts[0] ? S.accounts[0].id : ''); }
function lastReconDate(){
  var d = null;
  S.reconHistory.forEach(function(r){ if (!d || r.date > d) d = r.date; });
  S.checkins.forEach(function(c){ if (!d || c.date > d) d = c.date; });
  return d;
}

function debtStatus(){
  var cur = totalDebt(), t = today();
  var list = sortT(S.settings.debtTargets);
  var passed = list.filter(function(x){ return x.date < t; });
  var last = passed[passed.length - 1] || null;
  var up = list.filter(function(x){ return x.date >= t; })[0] || null;
  var behind = last ? r2(cur - last.amount) : 0;
  return { cur: cur, last: last, up: up, behind: behind > 0 ? behind : 0, toGo: up ? Math.max(0, r2(cur - up.amount)) : 0 };
}
function fundBal(f, asOf){
  return sum(S.funds.filter(function(x){ return x.fund === f && (!asOf || x.date <= asOf); }), function(x){ return x.kind === 'withdrawal' ? -x.amount : x.amount; });
}
function houseReceived(source){
  return sum(S.funds.filter(function(x){ return x.fund === 'house' && x.source === source; }), function(x){ return x.kind === 'withdrawal' ? -x.amount : x.amount; });
}
function savingsStatus(){
  var bal = fundBal('savings'), t = today();
  var list = sortT(S.settings.savingsTargets);
  var passed = list.filter(function(x){ return x.date < t; });
  var last = passed[passed.length - 1] || null;
  var up = list.filter(function(x){ return x.date >= t; })[0] || null;
  var behind = last ? r2(last.amount - bal) : 0;
  return { bal: bal, last: last, up: up, first: list[0] || null, behind: behind > 0 ? behind : 0, toGo: up ? Math.max(0, r2(up.amount - bal)) : 0 };
}

function supportFor(m){ return sum(S.income.filter(function(i){ return i.type === 'support' && i.month === m; }), function(i){ return i.amount; }); }
function supportRows(){
  var s = S.settings, cur = curMonth(), start = s.supportStartMonth || cur;
  var months = {};
  if (cur >= start) monthsRange(start, cur).forEach(function(m){ months[m] = 1; });
  S.income.forEach(function(i){ if (i.type === 'support' && i.month) months[i.month] = 1; });
  return Object.keys(months).sort().reverse().map(function(m){
    var got = supportFor(m), exp = +s.childSupportMonthly || 0;
    var tracked = m >= start;
    var closed = m < cur;
    return { month: m, got: got, short: tracked ? Math.max(0, r2(exp - got)) : 0, tracked: tracked, closed: closed };
  });
}
function missedSupport(){ return sum(supportRows().filter(function(r){ return r.tracked && r.closed; }), function(r){ return r.short; }); }

function nextPayday(){
  var s = S.settings; if (!s.payAnchor) return null;
  var step = Math.max(1, Math.round(+s.payEveryDays || 14));
  var d = parseYMD(s.payAnchor), t = today(), guard = 0;
  while (ymd(d) < t && guard++ < 2000) d.setDate(d.getDate() + step);
  return ymd(d);
}
function lastCheckin(){ var d = lastReconDate(); return d ? { date: d } : null; }
function checkinDue(){
  var t = today(), last = lastCheckin();
  if (last && last.date === t) return null;
  if (new Date().getDay() === 5) return 'friday';
  if (last && daysBetween(last.date, t) > 7) return 'overdue';
  return null;
}
function toDebtSavingsThisMonth(){
  var m = curMonth();
  var pay = sum(S.debtEntries.filter(function(e){ return e.kind === 'payment' && monthOf(e.date) === m; }), function(e){ return e.amount; });
  var sav = sum(S.funds.filter(function(f){ return f.fund === 'savings' && monthOf(f.date) === m; }), function(f){ return f.kind === 'withdrawal' ? -f.amount : f.amount; });
  return r2(pay + sav);
}
function nextAction(){
  if (checkinDue()) return 'Do your weekly reconciliation.';
  var over = monthSpending(curMonth()).cats.filter(function(c){ return c.left < 0 && c.id !== '_deleted'; })[0];
  if (over) return 'Stop spending on ' + over.name + '. It is over its limit.';
  var nd = nextDebt(), ds = debtStatus();
  if (nd){
    if (ds.behind > 0) return 'Catch up ' + money(ds.behind) + ' first. Next payment goes to: ' + nd.name + '.';
    return 'Next payment goes to: ' + nd.name + ' (' + money(debtBalance(nd)) + ' left).';
  }
  var ss = savingsStatus(), goal = +S.settings.savingsGoal || 0;
  if (ss.behind > 0) return 'Catch up ' + money(ss.behind) + ' to Savings first.';
  if (ss.bal < goal) return 'Next deposit goes to: Savings (' + money(ss.up ? ss.toGo : goal - ss.bal) + (ss.up ? ' to reach the ' + fmtDate(ss.up.date) + ' target).' : ' to reach the goal).');
  return 'All goals met. Keep following the rules.';
}

function bar(v, goal){
  var p = goal > 0 ? Math.max(0, Math.min(100, v / goal * 100)) : 0;
  return '<div class="bar"><div style="width:' + p.toFixed(1) + '%"></div></div><div class="small">' + Math.floor(p) + '% of ' + money(goal) + '</div>';

function vScorecard(){
  var s = S.settings, t = today(), cur = curMonth();
  var dts = sortT(s.debtTargets), sts = sortT(s.savingsTargets);

  Object.keys(months).sort().forEach(function(m){
    var dt = dts.filter(function(x){ return monthOf(x.date) === m; })[0];
    if (!dt){ var prior = dts.filter(function(x){ return monthOf(x.date) < m; }); dt = prior[prior.length - 1] || null; }
    var st = sts.filter(function(x){ return monthOf(x.date) === m; })[0] || null;
    var end = monthEnd(m), dA = '', sA = '';

    h += '<tr><td><b>' + monthName(m, true) + '</b></td><td>' + (dt ? money(dt.amount) : '—') + '</td><td>' + dA + '</td><td>' + (st ? money(st.amount) : '—') + '</td><td>' + sA + '</td></tr>' +

function acctReconCard(a){
  var key = 'a:' + a.id, t = today();
  var h = '<section class="card"><h2>' + esc(a.name) + '</h2>';
  if (!a.setup){
    return h + '<div class="small">Enter the balance your ' + esc(a.name) + ' app shows right now. The app tracks it from here.</div>' +
      '<form data-form="asetup" data-id="' + a.id + '"><label>Current balance</label><input name="actual" inputmode="decimal" autocomplete="off" placeholder="0.00">' +
      '<div class="btns"><button class="primary" type="submit">Set up ' + esc(a.name) + '</button></div></form></section>';
  }
  var c = acctCalc(a), d = rd[key];
  h += '<div class="small">Last reconciled: ' + (a.reconciled ? fmtDate(a.reconciled) : 'never') + '</div>' +
    '<div class="row"><span>Expected (everything logged)</span><span class="r">' + money(c.expected) + '</span></div>';
  if (c.pending) h += '<div class="row"><span>Pending, not in bank yet</span><span class="r">' + (c.pending > 0 ? '+' : '') + money(c.pending) + '</span></div>' +
    '<div class="row"><span><b>Should match your app</b></span><span class="r"><b>' + money(c.cleared) + '</b></span></div>';
  if (!d){
    return h + '<form data-form="acmp" data-id="' + a.id + '"><label>Actual balance in your ' + esc(a.name) + ' app</label><input name="actual" inputmode="decimal" autocomplete="off" placeholder="0.00">' +
      '<div class="btns"><button class="primary" type="submit">Compare</button></div></form></section>';
  }
  var diff = r2(d.actual - c.cleared);
  h += '<div class="row"><span>Actual</span><span class="r">' + money(d.actual) + '</span></div>' +
    '<div class="row"><span><b>Difference</b></span><span class="r"><b>' + (diff > 0 ? '+' : '') + money(diff) + '</b></span></div>';
  if (Math.abs(diff) < 0.005){
    return h + '<div class="status good">Balanced</div><form data-form="arecon" data-id="' + a.id + '"><label>Note (optional)</label><input name="note" autocomplete="off">' +
      '<div class="btns"><button class="primary" type="submit">Mark reconciled</button><button type="button" data-act="rdCancel" data-k="' + key + '">Cancel</button></div></form></section>';
  }
  h += '<div class="warn" style="margin-top:10px">Off by ' + money(Math.abs(diff)) + '. Your ' + esc(a.name) + ' app shows ' + (diff > 0 ? 'more' : 'less') + ' than expected.</div>' +
    '<div class="small">Try these in order: mark anything your bank has not posted yet as Pending, add anything you forgot to log, then post an adjustment for whatever is left.</div>';
  var since = a.reconciled || a.startDate;
  var list = c.items.filter(function(i){ return i.status === 'pending' || i.date >= since; }).slice(0, 40);
  h += '<details open><summary>Cleared or pending (' + list.length + ')</summary>' + (list.length ? list.map(function(i){
    function b(s, label){ return '<button class="sm' + (i.status === s ? ' primary' : '') + '" data-act="setStatus" data-k="' + key + '" data-src="' + i.src + '" data-id="' + i.id + '" data-s="' + s + '">' + label + '</button>'; }
    return '<div class="item"><span>' + esc(i.label) + '<br><span class="small">' + fmtDate(i.date) + (i.note ? ' · ' + esc(i.note) : '') + '</span></span><b class="r">' + (i.amount > 0 ? '+' : '') + money(i.amount) + '</b>' +
      '<div class="acts">' + b('cleared', 'Cleared') + b('pending', 'Pending') + '</div></div>';
  }).join('') : '<div class="small">Nothing logged since the last reconciliation.</div>') + '</details>';
  h += '<details><summary>Add a missing transaction</summary><form data-form="amiss" data-id="' + a.id + '">' +
    '<label>Type</label><select name="type">' + opt('out', 'Money out (spending)') + opt('in', 'Money in') + '</select>' +
    '<label>Amount</label><input name="amount" inputmode="decimal" autocomplete="off" placeholder="0.00">' +
    '<div class="mcat"><label>Category</label><select name="cat">' + S.settings.categories.map(function(x){ return opt(x.id, x.name); }).join('') + '</select></div>' +
    '<label>Date</label><input type="date" name="date" value="' + t + '">' +
    '<label>Note (optional)</label><input name="note" autocomplete="off">' +
    '<div class="btns"><button class="primary" type="submit">Add</button></div></form></details>';
  h += '<details><summary>Post an adjustment</summary><form data-form="aadj" data-id="' + a.id + '">' +
    '<label>Direction</label><select name="dir">' + opt('add', 'Add to the app balance', diff > 0) + opt('sub', 'Subtract from the app balance', diff < 0) + '</select>' +
    '<label>Amount</label><input name="amount" inputmode="decimal" autocomplete="off" value="' + Math.abs(diff) + '">' +
    '<label>Note</label><input name="note" autocomplete="off" placeholder="What was this? (required)">' +
    '<div class="btns"><button class="primary" type="submit">Post adjustment</button></div></form></details>' +
    '<div class="btns"><button type="button" data-act="rdCancel" data-k="' + key + '">Start over</button></div>';
  return h + '</section>';
}

function debtReconCard(d){

      '<div id="cw_' + d.id + '" class="warn hidden" style="margin-top:8px">A new charge breaks rule 1: no new carried card balances. Pay it off right away.</div>';
  } else {
    h += '<div class="small" style="margin-top:8px">The card shows ' + money(-diff) + ' less than the app. This is usually a payment you have not logged, or a refund.</div>' +
      '<label>Post the difference as</label><select name="reason" data-pf="' + d.id + '">' + opt('payment', 'A payment I did not log') + opt('other', 'Other adjustment (refund or credit)') + '</select>' +
      '<div id="pf_' + d.id + '"><label>Paid from</label><select name="from">' + acctOptions(defAcct(S.settings.payAcct), false, true) + '</select></div>';

  h += '<label>Note (optional)</label><input name="note" autocomplete="off">' +
    '<div class="btns"><button class="primary" type="submit">Post ' + (diff > 0 ? '+' : '-') + money(Math.abs(diff)) + '</button><button type="button" data-act="rdCancel" data-k="' + key + '">Cancel</button></div></form>';
  return h + '</section>';
}

    numField('Tax refund expected (house fund)', 'settings.taxRefundExpected', s.taxRefundExpected) +
    numField('Child support arrears owed (house fund)', 'settings.arrearsOwed', s.arrearsOwed) +
    numField('House fund goal (best case)', 'settings.houseGoal', s.houseGoal) +
    numField('Trip fund goal', 'settings.tripGoal', s.tripGoal) + '</section>';

  h += '<section class="card"><h2>Erase everything</h2><div class="small">Deletes all data on this phone and restores the starting numbers. Export a backup first.</div>' +
    '<div class="btns"><button data-act="reset">Erase all data</button></div></section>';
  return h;
}

/* ---------- actions ---------- */
function findIdx(arr, id){ for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return i; return -1; }
function setPath(path, val){ var p = path.split('.'), o = S; for (var i = 0; i < p.length - 1; i++) o = o[p[i]]; o[p[p.length - 1]] = val; }
function getPath(path){ var p = path.split('.'), o = S; for (var i = 0; i < p.length; i++) o = o == null ? o : o[p[i]]; return o; }

document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  var a = el.dataset.act, id = el.dataset.id, i = +el.dataset.i;
  if (a === 'tab') return go(el.dataset.v);
  if (a === 'go') return go(el.dataset.v);
  if (a === 'back') return go(lastTab);
  if (a === 'mprev'){ spendMonth = addMonths(spendMonth, -1); editTx = null; return render(); }
  if (a === 'mnext'){ spendMonth = addMonths(spendMonth, 1); editTx = null; return render(); }
  if (a === 'editTx'){ editTx = id; render(); window.scrollTo(0, 0); return; }
  if (a === 'cancelEdit'){ editTx = null; return render(); }
  if (a === 'delTx'){ if (confirm('Delete this transaction?')){ S.transactions.splice(findIdx(S.transactions, id), 1); if (editTx === id) editTx = null; save(); render(); } return; }
  if (a === 'togglePay'){ payOpen = payOpen === id ? null : id; render(); var inp = document.querySelector('form[data-form="pay"] input[name="amount"]'); if (inp) inp.focus(); return; }
  if (a === 'delDebtEntry'){ if (confirm('Delete this entry?')){ S.debtEntries.splice(findIdx(S.debtEntries, id), 1); save(); render(); } return; }
  if (a === 'delFund'){ if (confirm('Delete this entry?')){ S.funds.splice(findIdx(S.funds, id), 1); save(); render(); } return; }
  if (a === 'delInc'){ if (confirm('Delete this income entry?')){ S.income.splice(findIdx(S.income, id), 1); save(); render(); } return; }
  if (a === 'addCat'){ S.settings.categories.push({ id: uid(), name: 'New category', budget: 0, rollover: false }); snapshotCurrent(); save(); return render(); }
  if (a === 'delCat'){
    var c = S.settings.categories[i];
    if (confirm('Remove "' + c.name + '"? Past transactions stay, and past months keep their budgets.')){ S.settings.categories.splice(i, 1); snapshotCurrent(); save(); render(); }
    return;
  }
  if (a === 'addDebt'){ S.debts.push({ id: uid(), name: 'New debt', start: 0 }); save(); return render(); }
  if (a === 'delDebt'){
    var d = S.debts[i];
    if (confirm('Remove "' + d.name + '" and all of its payments?')){ S.debts.splice(i, 1); S.debtEntries = S.debtEntries.filter(function(x){ return x.debtId !== d.id; }); save(); render(); }
    return;
  }
  if (a === 'upDebt' && i > 0){ var t1 = S.debts[i]; S.debts[i] = S.debts[i - 1]; S.debts[i - 1] = t1; save(); return render(); }
  if (a === 'downDebt' && i < S.debts.length - 1){ var t2 = S.debts[i]; S.debts[i] = S.debts[i + 1]; S.debts[i + 1] = t2; save(); return render(); }
  if (a === 'addTarget'){
    var list = S.settings[el.dataset.k], srt = sortT(list), lastT = srt[srt.length - 1];
    list.push({ date: lastT ? monthEnd(addMonths(monthOf(lastT.date), 1)) : monthEnd(curMonth()), amount: lastT ? lastT.amount : 0 });
    save(); return render();
  }
  if (a === 'delTarget'){ S.settings[el.dataset.k].splice(i, 1); save(); return render(); }
  if (a === 'setStatus'){
    var arr = S[el.dataset.src], it = arr && arr[findIdx(arr, id)];
    if (it && it.status !== el.dataset.s){
      var dft = rd[el.dataset.k];
      if (dft){ dft.marks = dft.marks || {}; if (!dft.marks[id]) dft.marks[id] = { from: it.status, amount: it.amount }; }
      it.status = el.dataset.s;
      if (dft) dft.marks[id].to = it.status;
      save();
    }
    return render();
  }
  if (a === 'rdCancel'){ delete rd[el.dataset.k]; return render(); }
  if (a === 'addAcct'){ S.accounts.push({ id: uid(), name: 'New account', start: 0, startDate: '', startTs: 0, setup: false, reconciled: null }); save(); return render(); }
  if (a === 'delAcct'){
    var ac = S.accounts[i];
    if (confirm('Remove "' + ac.name + '"? Entries already logged to it stay, but it will no longer be reconciled.')){ S.accounts.splice(i, 1); save(); render(); }
    return;
  }
  if (a === 'export') return exportBackup();
  if (a === 'copyBackup') return copyBackup();
  if (a === 'importFile'){ var f = document.getElementById('importFile'); f.value = ''; f.click(); return; }
  if (a === 'importPaste'){ var box = document.getElementById('pasteBox'); return importText(box ? box.value : ''); }
  if (a === 'reset'){
    var ans = prompt('Type ERASE to delete all data on this phone.');
    if (ans && ans.trim().toUpperCase() === 'ERASE'){ S = defaultState(); snapshotCurrent(); save(); toast('All data erased.'); go('home'); }
    return;
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if (el.id === 'fFund') return toggleSource();
  if (el.id === 'txAcct') return toggleCardWarn();
  if (el.dataset && el.dataset.cw){ var cw = document.getElementById('cw_' + el.dataset.cw); if (cw) cw.className = el.value === 'charge' ? 'warn' : 'warn hidden'; return; }
  if (el.dataset && el.dataset.pf){ var pf = document.getElementById('pf_' + el.dataset.pf); if (pf) pf.className = el.value === 'payment' ? '' : 'hidden'; return; }
  if (el.name === 'type' && el.form && el.form.dataset.form === 'amiss'){ var mc = el.form.querySelector('.mcat'); if (mc) mc.className = el.value === 'out' ? 'mcat' : 'mcat hidden'; return; }
  if (el.id === 'iType'){
    toggleMonth();
    var ia = document.getElementById('iAcct');
    if (ia) ia.value = defAcct(el.value === 'support' ? S.settings.supportAcct : S.settings.payAcct);
    var amt = document.getElementById('iAmt');
    if (amt){ if (el.value === 'support' && amt.value === amt.dataset.lastpay) amt.value = ''; else if (el.value === 'pay' && !amt.value) amt.value = amt.dataset.lastpay; }
    return;
  }
  if (el.id === 'importFile'){
    var file = el.files && el.files[0]; if (!file) return;
    var rd = new FileReader();
    rd.onload = function(){ importText(String(rd.result || '')); };
    rd.onerror = function(){ toast('Could not read that file.'); };
    rd.readAsText(file);
    return;
  }
  if (el.dataset && el.dataset.note){ S.scoreNotes[el.dataset.note] = el.value; save(); return; }
  if (el.dataset && el.dataset.bind){
    var path = el.dataset.bind, ty = el.dataset.type, v;
    if (ty === 'num'){
      v = num(el.value);
      if (isNaN(v) || v < 0){ toast('Enter a number of 0 or more.'); el.value = getPath(path); return; }
    } else if (ty === 'bool') v = el.checked;
    else if (ty === 'month'){
      v = el.value.trim();
      if (!/^\d{4}-\d{2}$/.test(v)){ toast('Use the format YYYY-MM, like 2026-10.'); el.value = getPath(path); return; }
    } else {
      v = el.value.trim();
      if (el.type === 'date' && !v){ toast('Pick a date.'); el.value = getPath(path); return; }
      if (!v){ toast('This can\'t be blank.'); el.value = getPath(path); return; }
    }
    setPath(path, v);
    if (path.indexOf('settings.categories') === 0) snapshotCurrent();
    var am = path.match(/^accounts\.(\d+)\.(start|startDate)$/);
    if (am){
      var ac2 = S.accounts[+am[1]];
      if (am[2] === 'startDate') ac2.startTs = 0;
      else if (!ac2.startDate){ ac2.startDate = today(); ac2.startTs = Date.now(); }
      ac2.setup = true;
    }
    save();
    var tot = document.getElementById('catTotal');
    if (tot) tot.textContent = money(sum(S.settings.categories, function(c){ return +c.budget || 0; }));
    toast('Saved');
  }
});
document.addEventListener('input', function(e){
  var el = e.target;
  if (el.dataset && el.dataset.note){ S.scoreNotes[el.dataset.note] = el.value; save(); }
});

document.addEventListener('submit', function(e){
  var f = e.target, kind = f.dataset.form; if (!kind) return;
  e.preventDefault();
  var amt = f.amount ? num(f.amount.value) : NaN;
  var date = f.date && f.date.value ? f.date.value : today();
  var note = f.note ? f.note.value.trim() : '';

  var now = Date.now(), t = today();

  if (kind === 'tx'){
    if (isNaN(amt) || amt === 0) return toast('Enter an amount.');
    var catId = f.cat.value, acct = f.acct.value; lastCat = catId;
    if (acct.indexOf('debt:') !== 0) S.settings.lastSpendAcct = acct;
    if (editTx){
      var tx = S.transactions[findIdx(S.transactions, editTx)];
      if (tx){ tx.amount = amt; tx.catId = catId; tx.date = date; tx.note = note; tx.acct = acct; }
      editTx = null;
    } else S.transactions.push({ id: uid(), ts: now, date: date, amount: amt, catId: catId, note: note, acct: acct, status: 'cleared' });
    save();
    spendMonth = monthOf(date);
    var st = monthSpending(spendMonth).cats.filter(function(c){ return c.id === catId; })[0];
    render();
    if (acct.indexOf('debt:') === 0) return toast('Saved on ' + acctName(acct) + '. Rule 1: pay it off right away.');
    toast(st && st.left < 0 ? 'Saved. ' + st.name + ' is over its limit.' : 'Saved.' + (st ? ' ' + money(st.left) + ' left in ' + st.name + '.' : ''));
    return;
  }
  if (kind === 'pay'){
    if (!(amt > 0)) return toast('Enter a payment amount.');
    var d = S.debts[findIdx(S.debts, f.dataset.id)], bal = debtBalance(d);
    if (amt > bal && !confirm('That is more than the ' + money(bal) + ' balance. Save anyway?')) return;
    S.debtEntries.push({ id: uid(), ts: now, debtId: d.id, date: date, kind: 'payment', amount: amt, note: note, fromAcct: f.from.value, status: 'cleared' });
    save(); payOpen = null; render();
    toast(debtBalance(d) <= 0 ? d.name + ' is paid off.' : 'Payment saved. ' + money(debtBalance(d)) + ' left on ' + d.name + '.');
    return;
  }
  if (kind === 'fund'){
    if (!(amt > 0)) return toast('Enter an amount.');
    var fund = f.fund.value, fk = f.kind.value;
    if (fk === 'withdrawal' && amt > fundBal(fund) && !confirm('That is more than the fund balance. Save anyway?')) return;
    S.funds.push({ id: uid(), ts: now, fund: fund, kind: fk, amount: amt, date: date, source: fund === 'house' ? f.source.value : '', note: note, acct: f.acct.value, status: 'cleared' });
    save(); render(); toast('Saved.');
    return;
  }
  if (kind === 'inc'){
    if (!(amt > 0)) return toast('Enter an amount.');
    var type = f.type.value, iacct = f.acct.value;
    if (type === 'pay') S.settings.payAcct = iacct;
    if (type === 'support') S.settings.supportAcct = iacct;
    S.income.push({ id: uid(), ts: now, date: date, type: type, amount: amt, month: type === 'support' ? f.month.value : monthOf(date), note: note, acct: iacct, status: 'cleared' });
    save(); render();
    if (type === 'support'){
      var got = supportFor(f.month.value), exp = +S.settings.childSupportMonthly || 0;
      toast(got < exp ? 'Saved. ' + money(exp - got) + ' still short for ' + monthName(f.month.value) + '.' : 'Saved. Support for ' + monthName(f.month.value) + ' is paid in full. Move the goal amount today.');
    } else toast('Saved.');
    return;
  }

  /* reconciliation */
  var a = acctById(f.dataset.id), key = 'a:' + f.dataset.id;
  function logFix(k, text){ if (rd[k]) rd[k].fixes.push(text); }
  function history(type, ref, name, expected, actual, diff, hnote){
    S.reconHistory.push({ id: uid(), ts: now, date: t, type: type, ref: ref, name: name, expected: r2(expected), actual: r2(actual), diff: r2(diff), note: hnote });
  }
  if (kind === 'asetup'){
    var v = num(f.actual.value); if (isNaN(v)) return toast('Enter the balance from your app.');
    a.start = v; a.startDate = t; a.startTs = now; a.setup = true; a.reconciled = t;
    history('account', a.id, a.name, v, v, 0, 'Starting balance set');
    save(); render(); toast(a.name + ' is set up.');
    return;
  }
  if (kind === 'acmp'){
    var act = num(f.actual.value); if (isNaN(act)) return toast('Enter the balance from your app.');
    var c = acctCalc(a);
    rd[key] = { actual: act, expected0: c.cleared, diff0: r2(act - c.cleared), fixes: [] };
    render(); return;
  }
  if (kind === 'arecon'){
    var dr = rd[key]; if (!dr) return;
    var parts = [];
    Object.keys(dr.marks || {}).forEach(function(mid){ var mk = dr.marks[mid]; if (mk.to !== mk.from) parts.push('Marked ' + money(Math.abs(mk.amount)) + ' ' + mk.to); });
    parts = parts.concat(dr.fixes); if (note) parts.push(note);
    history('account', a.id, a.name, dr.expected0, dr.actual, dr.diff0, parts.join('; '));
    a.reconciled = t; delete rd[key];
    save(); render(); toast(a.name + ' reconciled.');
    return;
  }
  if (kind === 'amiss'){
    if (!(amt > 0)) return toast('Enter an amount.');
    if (f.type.value === 'out'){
      S.transactions.push({ id: uid(), ts: now, date: date, amount: amt, catId: f.cat.value, note: note, acct: a.id, status: 'cleared' });
      logFix(key, 'Added missing ' + catName(f.cat.value) + ' ' + money(amt));
    } else {
      S.income.push({ id: uid(), ts: now, date: date, type: 'other', amount: amt, month: monthOf(date), note: note, acct: a.id, status: 'cleared' });
      logFix(key, 'Added missing money in ' + money(amt));
    }
    save(); render(); toast('Added.');
    return;
  }
  if (kind === 'aadj'){
    if (!(amt > 0)) return toast('Enter an amount.');
    if (!note) return toast('Add a note saying what this was.');
    var signed = f.dir.value === 'sub' ? -amt : amt;
    S.acctAdj.push({ id: uid(), ts: now, acct: a.id, date: t, amount: signed, note: note, status: 'cleared' });
    logFix(key, 'Adjustment ' + (signed > 0 ? '+' : '') + money(signed) + ': ' + note);
    save(); render(); toast('Adjustment posted.');
    return;
  }
  if (kind === 'xfer'){
    if (!(amt > 0)) return toast('Enter an amount.');
    if (f.from.value === f.to.value) return toast('Pick two different accounts.');
    S.transfers.push({ id: uid(), ts: now, date: date, from: f.from.value, to: f.to.value, amount: amt, note: note, status: 'cleared' });
    save(); render(); toast('Transfer saved.');
    return;
  }
  var db = S.debts[findIdx(S.debts, f.dataset.id)], dkey = 'd:' + f.dataset.id;
  if (kind === 'dcmp'){
    var dact = num(f.actual.value); if (isNaN(dact)) return toast('Enter the balance from your statement or app.');
    rd[dkey] = { actual: dact };
    render(); return;
  }
  if (kind === 'drecon'){
    var dbal = debtBalance(db);
    history('debt', db.id, db.name, dbal, rd[dkey].actual, 0, note);
    db.reconciled = t; delete rd[dkey];
    save(); render(); toast(db.name + ' reconciled.');
    return;
  }
  if (kind === 'dpost'){
    var tracked = debtBalance(db), actual = rd[dkey].actual, diff = r2(actual - tracked), reason = f.reason.value, label;
    if (diff < 0 && reason === 'payment'){
      S.debtEntries.push({ id: uid(), ts: now, debtId: db.id, date: t, kind: 'payment', amount: -diff, note: note || 'Found while reconciling', fromAcct: f.from.value, status: 'cleared' });
      label = 'Missing payment ' + money(-diff);
    } else {
      S.debtEntries.push({ id: uid(), ts: now, debtId: db.id, date: t, kind: 'adjust', reason: reason, amount: diff, note: note, status: 'cleared' });
      label = ({ interest: 'Interest', charge: 'New charge', other: 'Other adjustment' }[reason]) + ' ' + (diff > 0 ? '+' : '') + money(diff);
    }
    history('debt', db.id, db.name, tracked, actual, diff, label + (note ? ': ' + note : ''));
    db.reconciled = t; delete rd[dkey];
    save(); render();
    toast(reason === 'charge' ? 'Posted. A new charge breaks rule 1. Pay it off now.' : db.name + ' reconciled.');
  }
});

/* ---------- backup ---------- */
function backupText(){ return JSON.stringify(S, null, 2); }
function markBackup(){ S.lastBackup = today(); save(); if (view === 'settings') render(); }
function exportBackup(){
  var text = backupText(), name = 'budget-backup-' + today() + '.json';
  try {
    var file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ files: [file], title: name }).then(function(){ markBackup(); toast('Backup exported.'); })
        .catch(function(err){ if (!err || err.name !== 'AbortError') downloadBackup(text, name); });
      return;
    }
  } catch (err) {}
  downloadBackup(text, name);
}
function downloadBackup(text, name){
  var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  var a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 15000);
  markBackup(); toast('Backup downloaded.');
}
function copyBackup(){
  var text = backupText();
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ markBackup(); toast('Backup copied. Paste it into Notes to keep it.'); }, function(){ fallbackCopy(text); });
  } else fallbackCopy(text);
}
function fallbackCopy(text){
  var box = document.getElementById('pasteBox');
  if (box){ box.value = text; box.focus(); box.select(); toast('Select all and copy the text in the box.'); }
}
function importText(text){
  var obj;
  try { obj = JSON.parse(text); } catch (e) { return toast('That is not a valid backup.'); }
  if (!obj || typeof obj !== 'object' || !obj.settings || !Array.isArray(obj.debts)) return toast('That is not a valid backup.');
  if (!confirm('Replace all data on this phone with this backup?')) return;
  S = normalize(obj); save(); toast('Backup restored.'); go('home');
}

/* ---------- home screen app setup ---------- */
(function(){
  var iconUrl = '';
  try {
    var c = document.createElement('canvas'); c.width = c.height = 180;
    var g = c.getContext('2d');
    g.fillStyle = ACCENT; g.fillRect(0, 0, 180, 180);
    g.fillStyle = '#ffffff'; g.font = 'bold 120px -apple-system, Helvetica, Arial, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('$', 90, 96);
    iconUrl = c.toDataURL('image/png');
  } catch (e) {}
  if (iconUrl){
    var l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = iconUrl; document.head.appendChild(l);
  }
  if (/^https?:$/.test(location.protocol)){
    var base = location.href.split('#')[0].split('?')[0];
    var manifest = { name: 'Budget and Debt Tracker', short_name: 'Budget', start_url: base, scope: new URL('./', base).href, display: 'standalone', background_color: '#ffffff', theme_color: '#ffffff', icons: iconUrl ? [{ src: iconUrl, sizes: '180x180', type: 'image/png' }] : [] };
    var m = document.createElement('link'); m.rel = 'manifest';
    m.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(m);
  }
  // Optional: works offline if sw.js is uploaded next to this file. Harmless if it isn't.
  if ('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
})();

render();
// Keep dates fresh if the app stays open past midnight or comes back from the background.
document.addEventListener('visibilitychange', function(){ if (!document.hidden && !document.activeElement.matches('input,select,textarea')) render(); });
